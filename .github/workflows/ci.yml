name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: 3krwldhr
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_STUDIO_URL: https://corecraft.sanity.studio
  NEXT_PUBLIC_SITE_URL: https://corecraft.example
  NEXT_PUBLIC_CURRENCY: BDT
  NEXT_PUBLIC_LOCALE: en-IN
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: Storefront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Builds against the public dataset; generateStaticParams needs network.
      - run: npm run build

  studio:
    name: Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx sanity build --no-minify
